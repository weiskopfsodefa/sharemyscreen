<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Zuschauer – sharemyscreen</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ffaa2b'/%3E%3Cpath d='M12 9.5v13l11-6.5z' fill='%230f0a06'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Spline+Sans+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="viewer-page">
  <video id="stream" autoplay playsinline muted></video>

  <div class="viewer-overlay" id="overlay">
    <a class="brand" href="/">share<b>my</b>screen<span class="tld">.de</span></a>
    <div class="viewer-status" id="status-text">Verbinde…</div>
    <div class="viewer-substatus" id="substatus-text"></div>
  </div>

  <button class="tap-to-start" id="tap-to-start">
    <span class="ring">▶</span>
    <span class="label">Tippen zum Starten</span>
  </button>

  <span class="chip viewer-chip faded" id="path-chip"></span>

  <div class="viewer-controls faded" id="controls">
    <button class="ctl-btn" id="mute-btn" hidden title="Ton an/aus">🔇</button>
    <button class="ctl-btn" id="fullscreen-btn" title="Vollbild">⛶</button>
  </div>

  <script type="module" src="/js/viewer.js"></script>
</body>
</html>
